<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Hookah Spliter</title>

    <!-- Ранняя инициализация темы (из localStorage / system) -->
    <script src="/theme-init.js"></script>

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <!-- Стили приложения -->
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="container py-3">
      <!-- Хедер без приветствия -->
      <div class="d-flex align-items-center justify-content-between mb-3">
        <h1 class="h5 mb-0">Hookah Spliter</h1>
      </div>

      <!-- Навигация -->
      <ul class="nav nav-tabs" id="mainTab" role="tablist">
        <li class="nav-item" role="presentation">
          <button
            class="nav-link active"
            id="tab-session"
            data-bs-toggle="tab"
            data-bs-target="#sessionPane"
            type="button"
            role="tab"
            aria-controls="sessionPane"
            aria-selected="true"
          >
            Сессия
          </button>
        </li>

        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            id="tab-people"
            data-bs-toggle="tab"
            data-bs-target="#peoplePane"
            type="button"
            role="tab"
            aria-controls="peoplePane"
            aria-selected="false"
          >
            Участники
          </button>
        </li>

        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            id="tab-settings"
            data-bs-toggle="tab"
            data-bs-target="#settingsPane"
            type="button"
            role="tab"
            aria-controls="settingsPane"
            aria-selected="false"
          >
            Настройки
          </button>
        </li>

        <!-- «Кабинет» — чип пользователя (аватар + ник/Гость) -->
        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            id="tab-user"
            data-bs-toggle="tab"
            data-bs-target="#historyPane"
            type="button"
            role="tab"
            aria-controls="historyPane"
            aria-selected="false"
          >
            <span class="user-chip">
              <img class="user-avatar" alt="" hidden />
              <span class="user-handle" data-min-font="10" data-max-font="14">Гость</span>
            </span>
          </button>
        </li>
      </ul>

      <!-- Контент вкладок -->
      <div class="tab-content pt-3">
        <div
          class="tab-pane fade show active"
          id="sessionPane"
          role="tabpanel"
          aria-labelledby="tab-session"
          tabindex="0"
        >
          <div class="text-muted small">Загрузка…</div>
        </div>

        <div
          class="tab-pane fade"
          id="peoplePane"
          role="tabpanel"
          aria-labelledby="tab-people"
          tabindex="0"
        >
          <div class="text-muted small">Загрузка…</div>
        </div>

        <div
          class="tab-pane fade"
          id="settingsPane"
          role="tabpanel"
          aria-labelledby="tab-settings"
          tabindex="0"
        >
          <div class="text-muted small">Загрузка…</div>
        </div>

        <!-- «Кабинет» (бывшие «Сессии») -->
        <div
          class="tab-pane fade"
          id="historyPane"
          role="tabpanel"
          aria-labelledby="tab-user"
          tabindex="0"
        >
          <div class="text-muted small">Загрузка…</div>
        </div>
      </div>

      <footer class="text-center text-muted small py-4">
        © <span id="year"></span> Hookah Spliter
      </footer>
    </div>

    <!-- Telegram WebApp SDK должен грузиться до main.js -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Bootstrap bundle (вкл. Popper) -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>

    <!-- Логика приложения -->
    <script src="/main.js" defer></script>
  </body>
</html>
