<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Hookah Spliter</title>

    <!-- Ранняя инициализация темы -->
    <script src="/theme-init.js"></script>

    <!-- Bootstrap (локально, без CDN) -->
    <link rel="stylesheet" href="/bootstrap.min.css" />

    <!-- Стили приложения -->
    <link rel="stylesheet" href="/styles.css" />

    <!-- Небольшой «сторожок»: если по какой-то причине Bootstrap не применился, подменим на локальный снова -->
    <script>
      // Проверяем наличие CSS-переменных Bootstrap
      document.addEventListener('DOMContentLoaded', () => {
        const hasBsVar = getComputedStyle(document.documentElement).getPropertyValue('--bs-body-bg');
        if (!hasBsVar) {
          const l = document.createElement('link');
          l.rel = 'stylesheet';
          l.href = '/bootstrap.min.css';
          document.head.appendChild(l);
        }
      });
    </script>
  </head>
  <body>
    <div class="container py-3">
      <!-- Хедер -->
      <div class="d-flex align-items-center justify-content-between mb-3">
        <h1 class="h5 mb-0">Hookah Spliter</h1>
      </div>

      <!-- Навигация -->
      <ul class="nav nav-tabs" id="mainTab" role="tablist">
        <li class="nav-item" role="presentation">
          <button
            class="nav-link active"
            id="tab-session"
            data-bs-toggle="tab"
            data-bs-target="#sessionPane"
            type="button"
            role="tab"
            aria-controls="sessionPane"
            aria-selected="true"
          >
            Сессия
          </button>
        </li>

        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            id="tab-people"
            data-bs-toggle="tab"
            data-bs-target="#peoplePane"
            type="button"
            role="tab"
            aria-controls="peoplePane"
            aria-selected="false"
          >
            Участники
          </button>
        </li>

        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            id="tab-settings"
            data-bs-toggle="tab"
            data-bs-target="#settingsPane"
            type="button"
            role="tab"
            aria-controls="settingsPane"
            aria-selected="false"
          >
            Настройки
          </button>
        </li>

        <!-- Кабинет: чип пользователя -->
        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            id="tab-user"
            data-bs-toggle="tab"
            data-bs-target="#historyPane"
            type="button"
            role="tab"
            aria-controls="historyPane"
            aria-selected="false"
          >
            <span class="user-chip">
              <img class="user-avatar" alt="" hidden />
              <span class="user-handle" data-min-font="10" data-max-font="14">Гость</span>
            </span>
          </button>
        </li>
      </ul>

      <!-- Контент вкладок -->
      <div class="tab-content pt-3">
        <div class="tab-pane fade show active" id="sessionPane" role="tabpanel" aria-labelledby="tab-session" tabindex="0">
          <div class="text-muted small">Загрузка…</div>
        </div>

        <div class="tab-pane fade" id="peoplePane" role="tabpanel" aria-labelledby="tab-people" tabindex="0">
          <div class="text-muted small">Загрузка…</div>
        </div>

        <div class="tab-pane fade" id="settingsPane" role="tabpanel" aria-labelledby="tab-settings" tabindex="0">
          <div class="text-muted small">Загрузка…</div>
        </div>

        <!-- Кабинет (бывшие «Сессии») -->
        <div class="tab-pane fade" id="historyPane" role="tabpanel" aria-labelledby="tab-user" tabindex="0">
          <div class="text-muted small">Загрузка…</div>
        </div>
      </div>

      <footer class="text-center text-muted small py-4">
        © <span id="year"></span> Hookah Spliter
      </footer>
    </div>

    <!-- Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Bootstrap JS (локально) -->
    <script src="/bootstrap.bundle.min.js" defer></script>

    <!-- Приложение -->
    <script src="/main.js" defer></script>
  </body>
</html>
